[General]
# Wallpaper: relative to this folder or an absolute path
background=background.jpg
# Darkening applied over the wallpaper (0.0 - 1.0)
dim=0.45
# Blur strength behind the cards (0.0 - 1.0)
blur=1.0
# Opacity of the dark tint on the glass cards (0.0 - 1.0)
cardOpacity=0.70
# Font family; empty = first available of JetBrainsMono Nerd Font, JetBrains Mono, Hack...
font=
# Locale for date and labels (e.g. es_ES, en_US); empty = system locale
locale=
use24h=true
# Text and logo of the system card (logo may be an absolute path, e.g. a distro logo)
systemName=
logo=icons/logo.svg
showSuspend=true
errorColor=#ff4444
showFooter=true
footer=Stealth Dark · original SDDM design by @madebydarkxz
